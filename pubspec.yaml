name: coachappmobile
description: "CoachApp mobile — Flutter client for the CoachApp fitness-coaching platform."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Dependency versions are aligned with the reference JasimExpress app so the ported
# lib/core compiles against the exact APIs it was written for.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  animated_snack_bar: ^0.4.0
  bloc: ^9.2.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  easy_localization: ^3.0.8
  excel: ^4.0.6
  extended_image: ^10.0.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^19.5.0
  flutter_map: ^8.2.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^11.0.0
  geocoding: ^3.0.0
  get_it: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  latlong2: ^0.9.1
  location: ^8.0.1
  material_color_utilities: ^0.13.0
  meta: ^1.16.0
  mobile_scanner: ^7.1.4
  package_info_plus: ^8.1.2
  page_animation_transition: ^1.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pin_code_fields: ^8.0.0
  pretty_dio_logger: ^1.4.0
  pull_to_refresh: ^2.0.0
  qr_flutter: ^4.1.0
  shadcn_ui: ^0.54.0
  share_plus: ^10.1.4
  shimmer: ^3.0.0
  signalr_netcore: ^1.4.4
  skeletonizer: ^2.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 100
